<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/png" href="/astrolokal-logo.png" />
    <title>AstroLokal Admin</title>
  </head>
  <body>
    <div id="root"></div>
    <!--
      Written at container startup by docker-entrypoint.d's runtime-config
      script — absent in local `npm run dev` (no such file exists), which is
      fine since apiClient.ts falls back to the build-time env var then.
      Must be a plain (non-module) script so it runs before the deferred
      module bundle below.
    -->
    <script src="/config.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
