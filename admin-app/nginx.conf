server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Client-side routed SPA (react-router, createBrowserRouter) — any path
    # that isn't a real static file falls back to index.html so deep links
    # like /tickets/5 work on a hard refresh, not just client-side navigation.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html references each build's content-hashed JS/CSS filenames —
    # without this, a browser can serve a stale cached copy on a normal
    # refresh, keeping a tab on old asset references (some possibly deleted
    # by the next deploy) until a hard refresh forces a real re-fetch
    # (observed live 2026-08-18). "no-cache" still allows caching, just
    # forces revalidation with the server every time, so a plain refresh
    # always sees the latest deploy. The hashed assets under /assets/ are
    # unaffected and stay safely long-cacheable.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # Written fresh by docker-entrypoint.d on every container start (see
    # admin-app/Dockerfile) — must never be cached, or a redeploy with a
    # changed API_BASE_URL wouldn't take effect until the cache expired.
    location = /config.js {
        add_header Cache-Control "no-store" always;
    }
}
