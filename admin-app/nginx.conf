server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Client-side routed SPA (react-router, createBrowserRouter) — any path
    # that isn't a real static file falls back to index.html so deep links
    # like /tickets/5 work on a hard refresh, not just client-side navigation.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
