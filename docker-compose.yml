services:
  postgres:
    image: postgres:16-alpine
    container_name: astrohelp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: astrohelp
      POSTGRES_PASSWORD: astrohelp
      POSTGRES_DB: astrohelp
    ports:
      - "5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U astrohelp -d astrohelp"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
